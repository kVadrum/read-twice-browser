      <div role="option" aria-selected="true" data-convid="AAMkADExAMPLEconvTEAM00001=">Pat Example - Team lunch</div>

          <div>Tue 10/20/2026 11:02 AM</div>
          <div class="XbIp4 GNqVo allowTextSelection">
            <div id="UniqueMessageBody_1" role="document" aria-label="Message body"><div class="rps_9f3c">
              <p>Lunch at noon? The team is meeting in the cafe on the second floor.</p>
              <p>Pat</p>
            </div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
