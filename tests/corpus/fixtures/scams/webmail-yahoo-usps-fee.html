<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Yahoo Mail</title></head>
<body>
  <nav>Inbox · Unread · Starred · Drafts · Sent · Archive · Spam</nav>
  <div role="main">
    <div data-test-id="message-view" data-test-expanded="true">
      <header data-test-id="message-header">
        <div data-test-id="message-from"><span data-test-id="email-pill"><span title="notice@usps-redelivery.example"><span>USPS Delivery</span></span></span></div>
        <div><span data-test-id="email-pill"><span data-test-id="message-to" title="me@example.com">me</span></span></div>
      </header>
      <div data-test-id="message-view-body">
        <div class="msg-body" data-test-id="message-view-body-content"><div><div id="yiv0123456789">
          <p>USPS: your package could not be delivered because the address was incomplete.</p>
          <p>A redelivery fee of $1.99 is due. Pay the fee to schedule a new delivery date.</p>
          <p><a href="https://usps-redelivery.example/pay">Schedule redelivery</a></p>
        </div></div></div>
      </div>
    </div>
  </div>
</body>
</html>
